spring:
  datasource:
    # docker-compose의 mysql 서비스명이 'mysql'일 때
    url: jdbc:mysql://mysql:3306/gifpt?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true&useUnicode=true
    username: ${DB_USER:gifpt}
    password: ${DB_PASS:gifpt_pw}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
      connection-timeout: 20000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate     # 운영/도커에선 스키마 검증만
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 100
        query:
          in_clause_parameter_padding: true

server:
  port: 8080

logging:
  level:
    org.springframework: info
    com.gifpt: info
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: warn

security:
  jwt:
    secret: ${JWT_SECRET}       # 반드시 주입
    refresh-token:
      cookie:
        secure: true 

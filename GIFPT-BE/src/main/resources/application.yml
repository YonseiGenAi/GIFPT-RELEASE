spring:
  application:
    name: gifpt
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # show_sql은 로거로 대체 (아래 logging 설정)
    defer-datasource-initialization: false
  sql:
    init:
      mode: never

server:
  port: 8080
  compression:
    enabled: true

logging:
  level:
    org.hibernate.SQL: debug         # 실행되는 SQL
    org.hibernate.orm.jdbc.bind: trace  # 바인딩 파라미터 (개발 중에만!)
    com.zaxxer.hikari: info
    root: info

gifpt:
  jwt:
    issuer: gifpt
    header: Authorization       # 액세스 토큰을 담는 헤더
    prefix: Bearer              # "Bearer <token>"
    clock-skew-seconds: 30      # 시계 오차 허용
    access-token:
      expiry-seconds: 3600      # 1시간
    refresh-token:
      expiry-seconds: 1209600   # 14일
      cookie:
        name: refresh_token
        same-site: Lax
        http-only: true
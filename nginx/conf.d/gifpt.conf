map $http_origin $cors_allow_origin {
    default "";
    "~^https://gifpt-front\.vercel\.app$" $http_origin;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 50m;

  # 공통 프록시 헤더
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # CORS 헤더 (모든 API/스웨거 경로에 적용)
  set $cors_headers '';
  if ($cors_allow_origin != "") {
      set $cors_headers "true";
  }

  # 프리플라이트 빠른 응답
  location ~ ^/(api|v3/api-docs|swagger-ui)(/|$) {
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Requested-With" always;
        add_header Access-Control-Max-Age "3600" always;
        return 204;
    }
    proxy_pass http://spring:8080;
    # 실제 요청에도 CORS 헤더 노출
    if ($cors_headers = "true") {
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Expose-Headers "Authorization,Set-Cookie" always;
    }
  }

  # 스웨거 정적 파일도 프록시 (이미 잘 뜨는 상태 유지)
  location /swagger-ui/ { proxy_pass http://spring:8080; }

  # 헬스
  location = /healthz { proxy_pass http://spring:8080/healthz; }
}

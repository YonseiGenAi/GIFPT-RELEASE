# nginx/conf.d/gifpt.conf
# 프록시 타임아웃/업로드 사이즈 등 기본 튜닝
proxy_read_timeout 300s;
proxy_send_timeout 300s;
client_max_body_size 200m;  # PDF 업로드 대비

# 스프링/장고 업스트림
upstream spring_upstream {
    server spring:8080;   # compose 서비스명 기준
    keepalive 32;
}

upstream django_upstream {
    server django:8000;   # compose 서비스명 기준
    keepalive 32;
}

server {
    listen 80;
    server_name _;  # 도메인 없으면 기본

    # 공용 정적 파일(업로드/결과물) 서빙 (선택)
    location /files/uploads/ {
        alias /data/uploads/;
        autoindex off;
    }
    location /files/results/ {
        alias /data/results/;
        autoindex off;
    }

    # 스프링 백엔드 → /api 로 라우팅
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://spring_upstream;
    }

    # 장고 AI 워커 API → /ai 로 라우팅
    location /ai/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://django_upstream;
    }

    # 헬스 체크(선택): 루트로 접근하면 Spring 헬스로 프록시
    location = / {
        return 302 /api/v1/health;
    }
}

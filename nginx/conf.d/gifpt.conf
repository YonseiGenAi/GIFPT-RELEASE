server {
  listen 80;
  server_name _;

  client_max_body_size 50m;

  # 공통 프록시 헤더
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # OpenAPI JSON (정규 경로)
  location = /v3/api-docs {
    proxy_pass http://spring:8080/v3/api-docs;
  }

  # 슬래시로 들어오면 301로 정규화
  location = /v3/api-docs/ {
    return 301 /v3/api-docs;
  }

  # swagger-config 직접 프록시
  location = /v3/api-docs/swagger-config {
    proxy_pass http://spring:8080/v3/api-docs/swagger-config;
  }

  # Spring API (원하면 /api로만 라우팅)
  location /api/ {
    proxy_pass http://spring:8080/;
  }

  # 헬스 확인용
  location = /healthz {
    proxy_pass http://spring:8080/healthz;
  }
}
